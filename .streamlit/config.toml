# Titanic Explorer theme — "ocean liner": warm ivory paper / deep ship-navy,
# brass hardware accents, Playfair Display serif headings.
# Dual light/dark; the settings appearance toggle stays available.

[theme]
showWidgetBorder = false
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "8px"
font = "'Source Sans 3':https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&display=swap"
headingFont = "'Playfair Display':https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
codeFontSize = "0.85rem"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["40px", "30px", "24px", "19px", "16px", "14px"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
linkUnderline = true

[theme.light]
primaryColor = "#8A5A2B"
backgroundColor = "#FAF6EF"
secondaryBackgroundColor = "#F1E9DA"
codeBackgroundColor = "#EFE6D5"
textColor = "#22303F"
linkColor = "#8A5A2B"
borderColor = "#E0D3BC"
codeTextColor = "#3B2E1E"
grayColor = "#7A6A55"
blueColor = "#2F5D62"
greenColor = "#4A7C59"
redColor = "#A63A2B"
yellowColor = "#C08A2E"
orangeColor = "#B4652A"
violetColor = "#6D5A8D"
# Life-buoy palette: navy, brass, sea green, crimson, slate, sand
chartCategoricalColors = ["#22415C", "#B08247", "#4A7C59", "#A63A2B", "#5E7A8C", "#C9B48C"]
dataframeBorderColor = "#E0D3BC"
dataframeHeaderBackgroundColor = "#F1E9DA"

[theme.dark]
primaryColor = "#D4A94E"
backgroundColor = "#101A26"
secondaryBackgroundColor = "#17232F"
codeBackgroundColor = "#1E2C3A"
textColor = "#E9DFCB"
linkColor = "#D4A94E"
borderColor = "#2A3A4A"
codeTextColor = "#E9DFCB"
grayColor = "#93A1B0"
blueColor = "#6FA8C7"
greenColor = "#7FB08A"
redColor = "#D97A66"
yellowColor = "#E5C06B"
orangeColor = "#D08A4E"
violetColor = "#A996C9"
chartCategoricalColors = ["#6FA8C7", "#D4A94E", "#7FB08A", "#D97A66", "#9DB4C4", "#C9B48C"]
dataframeBorderColor = "#2A3A4A"
dataframeHeaderBackgroundColor = "#17232F"
dataframeHeaderTextColor = "#E9DFCB"

[theme.light.sidebar]
backgroundColor = "#F1E9DA"
secondaryBackgroundColor = "#E9DFCB"
codeBackgroundColor = "#EFE6D5"
textColor = "#22303F"
borderColor = "#E0D3BC"
primaryColor = "#8A5A2B"
linkColor = "#8A5A2B"
dataframeHeaderBackgroundColor = "#E9DFCB"
dataframeBorderColor = "#E0D3BC"

[theme.dark.sidebar]
backgroundColor = "#0B141D"
secondaryBackgroundColor = "#17232F"
codeBackgroundColor = "#1E2C3A"
textColor = "#E9DFCB"
borderColor = "#2A3A4A"
primaryColor = "#D4A94E"
linkColor = "#D4A94E"
dataframeHeaderBackgroundColor = "#17232F"
dataframeBorderColor = "#2A3A4A"
